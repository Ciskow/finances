<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Amount preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css">
</head>
<body>
<div class="fin-stack">
  <div class="fin-card">
    <div class="fin-card-head"><h3 class="fin-card-title">Saldo previsto</h3></div>
    <span class="fin-amount fin-amount-xl"><span class="fin-amount-cur">R$</span><span>5.304</span><span class="fin-amount-dec">,28</span></span>
    <div class="fin-card-sub">valor estimado após pagar todas as contas</div>
  </div>
  <div class="fin-stage" style="padding:0 var(--space-2)">
    <span class="fin-amount fin-amount-lg"><span class="fin-amount-cur">R$</span><span>19.379</span><span class="fin-amount-dec">,50</span></span>
    <span class="fin-amount fin-amount-md fin-amount-positive"><span class="fin-amount-cur">R$</span><span>5.304</span><span class="fin-amount-dec">,28</span></span>
    <span class="fin-amount fin-amount-md fin-amount-negative"><span>−</span><span class="fin-amount-cur">R$</span><span>1.250</span><span class="fin-amount-dec">,00</span></span>
    <span class="fin-amount fin-amount-md fin-amount-estimate"><span>≈</span><span class="fin-amount-cur">R$</span><span>2.332</span><span class="fin-amount-dec">,54</span></span>
  </div>
</div>
</body>
</html>
