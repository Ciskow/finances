<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>MonthSwitcher preview</title>

      <button class="fin-btn fin-btn-ghost fin-btn-icon" aria-label="Próximo mês"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
      <button class="fin-month-title">dezembro <span class="fin-month-year">2026</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
    </div>
  </div>
</div>
