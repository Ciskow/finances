<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Card preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css">
</head>
<body>
<div class="fin-stack">
  <section class="fin-card" style="max-width:420px">
    <div class="fin-card-head"><h3 class="fin-card-title">Cartões</h3><span class="fin-card-sub">Fatura de dezembro</span></div>
    <span class="fin-amount fin-amount-lg"><span class="fin-amount-cur">R$</span><span>7.999</span><span class="fin-amount-dec">,70</span></span>
    <p class="fin-overline" style="margin:var(--space-4) 0 var(--space-2)">Limite livre</p>
    <div class="fin-well" style="display:flex;justify-content:space-between"><span class="fin-card-sub">Disponível de R$ 65.000,00</span><strong class="fin-num" style="color:var(--positive-ink)">R$ 13.870,30</strong></div>
  </section>
</div>
</body>
</html>
