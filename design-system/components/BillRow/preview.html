<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>BillRow preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css">
</head>
<body>
<div class="fin-stack">
  <div class="fin-card" style="padding-block:var(--space-3)">
    <label class="fin-row"><input type="checkbox" class="fin-check"><span class="fin-row-main"><span class="fin-row-label">Fatura Santander Unique</span></span><span class="fin-row-amount">R$ 7.999,70</span></label>
    <label class="fin-row"><input type="checkbox" class="fin-check" checked><span class="fin-row-main"><span class="fin-row-label">Guardar na reserva</span></span><span class="fin-row-amount">R$ 4.000,00</span></label>
    <label class="fin-row"><input type="checkbox" class="fin-check"><span class="fin-row-main"><span class="fin-row-label">Aluguel</span><span class="fin-row-meta"><i class="fin-avatar fin-avatar-partner">E</i>Esposa · dia 01</span></span><span class="fin-row-amount">R$ 4.800,00<small>sua parte R$ 2.400,00</small></span></label>
    <label class="fin-row"><input type="checkbox" class="fin-check"><span class="fin-row-main"><span class="fin-row-label">Condomínio</span><span class="fin-row-meta"><i class="fin-avatar">1</i>Você</span></span><span class="fin-row-amount">R$ 1.580,00<small>sua parte R$ 790,00</small></span></label>
    <label class="fin-row"><input type="checkbox" class="fin-check"><span class="fin-row-main"><span class="fin-row-label">Apartamento Vila Olímpia <span class="fin-badge fin-badge-estimate">estimado</span></span></span><span class="fin-row-amount" style="color:var(--warning-ink)">≈ R$ 2.332,54</span></label>
  </div>
</div>
</body>
</html>
