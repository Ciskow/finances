<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>TabBar preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css">
</head>
<body>
<div class="fin-stage">
  <div class="fin-tabbar-wrap" style="width:380px;max-width:100%">
    <nav class="fin-tabbar" aria-label="Seções">
      <button class="fin-tab" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>Início</button>
      <button class="fin-tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h14l-3-3M20 16H6l3 3"/></svg>Fluxo</button>
      <button class="fin-tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/></svg>Cartões</button>
      <button class="fin-tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V5a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v15M15 10h3a1 1 0 0 1 1 1v9M3 20h18M9 8h2M9 12h2M9 16h2"/></svg>Casa</button>
    </nav>
    <button class="fin-btn fin-btn-fab" aria-label="Adicionar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>
</div>
<script>
  document.querySelector('.fin-tabbar').addEventListener('click', function (e) {
    var b = e.target.closest('.fin-tab'); if (!b) return;
    this.querySelectorAll('.fin-tab').forEach(function (x) { x.removeAttribute('aria-current'); });
    b.setAttribute('aria-current', 'page');
  });
</script>
</body>
</html>
