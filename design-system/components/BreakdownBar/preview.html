<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>BreakdownBar preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css">
</head>
<body>
<div class="fin-stack">
  <div class="fin-card">
    <div class="fin-bar" role="img" aria-label="Salário: 27% casa, 52% contas pessoais, 2% dia a dia, 19% sobra">
      <span class="fin-bar-seg fin-tone-deep" style="flex:27"></span>
      <span class="fin-bar-seg fin-tone-primary" style="flex:52"></span>
      <span class="fin-bar-seg fin-tone-neutral" style="flex:2"></span>
      <span class="fin-bar-seg fin-tone-positive" style="flex:19"></span>
    </div>
    <ul class="fin-legend">
      <li><span class="fin-legend-label"><i class="fin-dot fin-tone-deep"></i>Sua metade da casa</span><span class="fin-legend-value">− R$ 7.666,22 <small>27%</small></span></li>
      <li><span class="fin-legend-label"><i class="fin-dot fin-tone-primary"></i>Contas pessoais</span><span class="fin-legend-value">− R$ 14.529,50 <small>52%</small></span></li>
      <li><span class="fin-legend-label"><i class="fin-dot fin-tone-neutral"></i>Dia a dia</span><span class="fin-legend-value">− R$ 500,00 <small>2%</small></span></li>
      <li><span class="fin-legend-label"><i class="fin-dot fin-tone-positive"></i>Sobra</span><span class="fin-legend-value" style="color:var(--positive-ink)">R$ 5.304,28 <small>19%</small></span></li>
    </ul>
  </div>
  <div class="fin-card">
    <div style="display:flex;justify-content:space-between;margin-bottom:var(--space-2)">
      <span><span class="fin-legend-label"><i class="fin-dot fin-tone-primary"></i>Você paga</span><span class="fin-legend-value">R$ 8.199,90</span></span>
      <span style="text-align:right"><span class="fin-legend-label" style="justify-content:flex-end">Esposa paga<i class="fin-dot fin-tone-partner"></i></span><span class="fin-legend-value">R$ 7.132,54</span></span>
    </div>
    <div class="fin-bar fin-bar-labeled" role="img" aria-label="Você paga 53,5%, esposa paga 46,5%">
      <span class="fin-bar-seg fin-tone-primary" style="flex:53.5">53,5%</span>
      <span class="fin-bar-seg fin-tone-partner" style="flex:46.5">46,5%</span>
    </div>
  </div>
</div>
</body>
</html>
